<section class="stone-panel menu-panel p-3 p-md-4" aria-labelledby="menu-title">
  <h2 id="menu-title" class="panel-heading text-center mb-3">
    Escolha uma opção:
  </h2>
  <div class="d-grid gap-2" cdkMenu aria-label="Opções do portfólio">
    @for (option of options; track option.section) {
    <button
      class="menu-option btn d-flex align-items-center gap-3 text-start"
      cdkMenuItem
      type="button"
      (click)="select(option.section)"
    >
      <img class="menu-icon" [src]="option.icon" alt="" aria-hidden="true" />
      <span>{{ option.label }}</span>
      <span class="menu-arrow ms-auto" aria-hidden="true">›</span>
    </button>
    }
  </div>
</section>
