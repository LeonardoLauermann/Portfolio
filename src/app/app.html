<main class="game-stage container-fluid p-3 p-xl-4">
  <a class="skip-link visually-hidden-focusable" href="#game-menu"
    >Pular para o menu principal</a
  >
  <app-profile />
  <app-hero />
  @if (showDesktopSkills()) {
  <app-skills />
  }

  <app-character [paused]="activeSection() !== null" />
  <div class="door-fire door-fire-left" aria-hidden="true"></div>
  <div class="door-fire door-fire-right" aria-hidden="true"></div>
  <div class="hall-dust" aria-hidden="true">
    <span class="dust-mote"></span><span class="dust-mote"></span
    ><span class="dust-mote"></span><span class="dust-mote"></span
    ><span class="dust-mote"></span>
  </div>

  <app-main-menu id="game-menu" (sectionSelected)="selectSection($event)" />
  <app-dialogue />
  @defer (when activeSection() !== null) { @if (activeSection(); as section) {
  <app-section-modal [section]="section" (closed)="closeSection()" />
  } } @loading {
  <span class="visually-hidden" role="status">Carregando seção...</span>
  }
  <app-objectives />
</main>
