<section class="stone-panel audio-panel p-3" aria-label="Controles de áudio">
  <button
    class="sound-control btn btn-sm w-100"
    type="button"
    [attr.aria-pressed]="sound.enabled()"
    (click)="toggleSound()"
  >
    <span class="material-symbols-outlined" aria-hidden="true"
      >{{ sound.enabled() ? 'volume_up' : 'volume_off' }}</span
    >
    <span>{{ sound.enabled() ? 'Som ligado' : 'Ativar som' }}</span>
  </button>
  <label class="music-volume mt-2">
    <span>Volume da música</span>
    <input
      type="range"
      min="0"
      max="0.6"
      step="0.01"
      [value]="sound.musicVolume()"
      aria-label="Volume da música ambiente"
      (input)="updateMusicVolume($event)"
    />
    <output>{{ (sound.musicVolume() * 100).toFixed(0) }}%</output>
  </label>
</section>
