<section class="stone-panel audio-panel p-2" aria-label="Controles de áudio">
  <button
    class="audio-button sound-button btn"
    type="button"
    [attr.aria-pressed]="sound.enabled()"
    [attr.aria-label]="sound.enabled() ? 'Silenciar sons' : 'Ativar sons'"
    [class.sound-active]="sound.enabled()"
    (click)="toggleSound()"
  >
    <span class="material-symbols-outlined" aria-hidden="true"
      >{{ sound.enabled() ? 'volume_up' : 'volume_off' }}</span
    >
    <span>{{ sound.enabled() ? 'Som ativo' : 'Som mudo' }}</span>
  </button>
  <button
    class="audio-button volume-button btn"
    type="button"
    [attr.aria-expanded]="volumeControlsOpen()"
    [attr.aria-controls]="'music-volume-controls'"
    [attr.aria-label]="
      volumeControlsOpen() ? 'Fechar ajuste de volume' : 'Ajustar volume da música'
    "
    (click)="toggleVolumeControls()"
  >
    <span class="material-symbols-outlined" aria-hidden="true">tune</span>
    <span>Volume</span>
  </button>

  @if (volumeControlsOpen()) {
  <div class="volume-popover stone-panel p-3" id="music-volume-controls">
    <div class="volume-heading">
      <label for="ambient-volume">Música ambiente</label>
      <output>{{ (sound.musicVolume() * 100).toFixed(0) }}%</output>
    </div>
    <input
      id="ambient-volume"
      class="music-volume"
      type="range"
      min="0"
      max="60"
      step="1"
      [value]="sound.musicVolume() * 100"
      [attr.aria-valuetext]="(sound.musicVolume() * 100).toFixed(0) + '%'"
      (input)="updateMusicVolume($event)"
    />
    <div class="volume-range-labels" aria-hidden="true">
      <span>Mudo</span><span>60%</span>
    </div>
  </div>
  }
</section>
